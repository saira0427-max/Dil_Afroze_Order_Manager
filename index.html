<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Dil Afroze Order Manager</title>
<meta name="description" content="Order management app for Dil Afroze — Natural Skin & Hair Care">
<meta name="theme-color" content="#328788">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dil Afroze">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <header class="app-header">
    <div class="brand">
      <img class="brand-logo-img" src="icons/logo.png" alt="Dil Afroze"
           onerror="this.style.display='none'; document.querySelector('.brand-logo-text').style.display='flex'">
      <div class="brand-logo-text" style="display:none">
        <span class="wordmark">DIL AFR<span class="o-mark">O</span>ZE</span>
      </div>
      <span class="tagline">Natural Skin &amp; Hair Care</span>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19.14 12.94a7.14 7.14 0 0 0 .06-.94 7.14 7.14 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7.3 7.3 0 0 0-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.14 7.14 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.39 1.04.71 1.62.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54a7.3 7.3 0 0 0 1.62-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
    </button>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="products">Products</button>
    <button class="tab-btn" data-tab="new-order">New Order</button>
    <button class="tab-btn" data-tab="orders">Orders</button>
  </nav>

  <main id="main">
    <!-- PRODUCTS TAB -->
    <section class="tab-panel active" id="tab-products">
      <div class="panel-actions">
        <button class="btn btn-primary" id="addProductBtn">+ Add Product</button>
        <button class="btn btn-ghost" id="manageCatsBtn">Categories</button>
      </div>
      <div id="productsList"></div>
    </section>

    <!-- NEW ORDER TAB -->
    <section class="tab-panel" id="tab-new-order">
      <div class="card" id="customerCard">
        <button class="collapsible-header" id="customerToggle">
          <span>Customer Details</span>
          <svg class="chevron" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
        </button>
        <div class="collapsible-body" id="customerBody">
          <label class="field">
            <span>Name *</span>
            <input type="text" id="custName" placeholder="Customer name">
          </label>
          <label class="field">
            <span>Phone</span>
            <input type="tel" id="custPhone" placeholder="07xxx xxxxxx">
          </label>
          <label class="field">
            <span>Email</span>
            <input type="email" id="custEmail" placeholder="email@example.com">
          </label>
          <label class="field">
            <span>Delivery Address</span>
            <textarea id="custAddress" rows="3" placeholder="Address"></textarea>
          </label>
          <label class="field">
            <span>Notes</span>
            <textarea id="custNotes" rows="2" placeholder="Order notes"></textarea>
          </label>
        </div>
      </div>

      <div class="cat-filter-row" id="orderCatFilter"></div>

      <div id="orderProductsList"></div>

      <div class="card" id="customItemCard">
        <button class="collapsible-header" id="customItemToggle">
          <span>+ Add Custom / One-off Item</span>
          <svg class="chevron" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
        </button>
        <div class="collapsible-body" id="customItemBody">
          <label class="field">
            <span>Item name</span>
            <input type="text" id="ciName" placeholder="Item name">
          </label>
          <div class="field-row">
            <label class="field">
              <span>Price (£)</span>
              <input type="number" id="ciPrice" min="0" step="0.01" placeholder="0.00">
            </label>
            <label class="field field-qty">
              <span>Qty</span>
              <input type="number" id="ciQty" min="1" step="1" value="1">
            </label>
          </div>
          <label class="checkbox-field">
            <input type="checkbox" id="ciGift">
            <span>Mark as GIFT</span>
          </label>
          <button class="btn btn-primary btn-block" id="addCustomItemBtn">Add Item</button>
        </div>
      </div>

      <div class="card summary-card" id="orderSummary" style="display:none">
        <h3>Order Summary</h3>
        <div id="summaryItems"></div>
        <label class="field">
          <span>Discount (£)</span>
          <input type="number" id="orderDiscount" min="0" step="0.01" value="0">
        </label>
        <div class="summary-total-row">
          <span>Total</span>
          <span id="summaryTotal">£0.00</span>
        </div>
        <button class="btn btn-primary btn-block btn-large" id="saveOrderBtn">Save Order</button>
      </div>
    </section>

    <!-- ORDERS TAB -->
    <section class="tab-panel" id="tab-orders">
      <div class="panel-actions">
        <button class="btn btn-ghost" id="downloadCsvBtn">⬇ Download CSV</button>
      </div>
      <div class="status-filter-row" id="statusFilter">
        <button class="pill active" data-status="all">All</button>
        <button class="pill" data-status="new">New</button>
        <button class="pill" data-status="packaged">Packaged</button>
        <button class="pill" data-status="shipped">Shipped</button>
        <button class="pill" data-status="delivered">Delivered</button>
      </div>
      <div id="ordersList"></div>
    </section>
  </main>

</div>

<!-- MODAL ROOT -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
